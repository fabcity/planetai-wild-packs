id: surf
name: Surf tomorrow
description: >-
  At five in the evening, up to three spots where surf could be good tomorrow, each with its swell, power, wind, tide
  and a Windy link, from Open-Meteo's GFS Wave swell, sea level and wind. A screen of a 16 km model, not a surf report.
  Answer with how it was, and `planetai run surf review` keeps a journal for each spot.
author: Tomas Diez (Fab City Foundation)
version: 0.1.0
requires: { node: ">=0.91.0" }
kind: code
domain: coast
metrics: [surf_good, surf_kw, surf_from_h, surf_to_h, surf_swell_m, surf_period_s, surf_swell_dir, surf_mixed,
          surf_swell2_m, surf_period2_s, surf_swell2_dir, surf_wind_kmh, surf_wind_dir, surf_tide]
scales: [bioregion]
sources: [environmental/bioregion/open-meteo-marine, environmental/planet/open-meteo]
env:
  # No padding after `=`: a value pasted after spaces makes the line `VAR= value`, which shell reads as a command.
  - "# surf: the spots to watch, ids from packs/surf/spots.yml, comma-separated. Blank keeps the pack idle."
  - "SURF_SPOTS="
  - "# surf: the shortest swell period that counts, in seconds (GFS Wave's period, the kind Windy shows)"
  - "SURF_MIN_PERIOD=10"
agent_scripts: [review]
needs: >-
  Network to marine-api.open-meteo.com and api.open-meteo.com. No key. Three requests every three hours, each counted
  once per spot by Open-Meteo: 36 calls a poll for twelve spots, under 300 a day against a free tier of 10,000 per
  public IP. The evening message is a `warn` alert, so it reaches Telegram only where ALERT_LEVEL is warn or info.
attribution: >-
  Weather and marine data by Open-Meteo.com (CC BY 4.0); NOAA GFS Wave; Copernicus Marine / MeteoFrance.
