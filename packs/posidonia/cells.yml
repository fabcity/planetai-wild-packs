# Reads the coast pack's `marine-point` observations. This pack adds no source and no metric: it is a
# reading of somebody else's number against a threshold measured in this sea.
#
# `partial`, never `live`: the sea temperature is a model point sample at the nearest ocean grid cell.
# Nobody here put a thermometer in the water, and the cell must not claim they did.
- cell: "Environmental|Bioregion"
  unit: "days in the last 90 with mean sea temperature at or above 28.4 °C (Posidonia thermal-stress threshold)"
  state: partial
  notes: "Marbà & Duarte 2010, measured at Cabrera, Balearic Islands: shoot mortality rises above 28.4 °C"
  sql: |
    WITH d AS (
      SELECT (bucket AT TIME ZONE current_setting('TimeZone'))::date AS day, avg(mean) AS t
      FROM readings_1h
      WHERE sensor_id = 'marine-point' AND metric = 'sea_surface_temp'
        AND bucket > now() - interval '90 days'
      GROUP BY 1 HAVING count(*) >= 12)
    SELECT count(*) AS value FROM d WHERE t >= 28.4
