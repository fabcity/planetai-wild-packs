id: singapore-nea
name: Singapore NEA and PUB open data
description: "NEA and PUB open data from data.gov.sg for Singapore nodes - air and PSI, temperature, humidity, rainfall, wind, UV, WBGT heat stress, flood alerts, dengue clusters, and the 2-hour, 24-hour and 4-day forecasts."
author: saadcaffeine (Singapore node)
version: "0.3.2"
requires: { node: ">=0.40.0" }
kind: code
domain: weather
scales: [city]
env:
  - "# singapore-nea: optional free data.gov.sg API key (higher rate limit). Blank works: the pack paces itself."
  - "NEA_API_KEY="
needs:
  - api-open.data.gov.sg
attribution: >-
  Contains information from National Environment Agency and PUB datasets on data.gov.sg, accessed under the
  Singapore Open Data Licence.
