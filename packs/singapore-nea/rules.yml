# Singapore NEA rules. They read the `observations` view (NEA's sensors are kind=model, so never `stats`) and only
# trust a reading from the last 30-90 minutes: a station that stopped reporting must not keep an alert alive.
# Every message carries en, id and es with the same placeholders. Rule ids are namespaced automatically.
#
# Thresholds are published bands, not this node's invention:
#   PSI: NEA bands, 101+ is Unhealthy.   UV: WHO, 11+ is Extreme.   Heat: US NWS heat index, 103 F (39.4 C) is Danger.
# heat_index_danger is the fallback: temperature with humidity, NOT the WBGT that NEA's own heat advisories use. It stays
# quiet whenever a WBGT reading under an hour old exists, because heat_stress_* below is the better rule.

- id: haze_psi_unhealthy
  level: act
  cooldown_minutes: 360
  sql: |
    SELECT sensor_id, name, value::float AS psi
    FROM observations
    WHERE sensor_id = 'nea-psi' AND metric = 'psi' AND value > 100 AND ts > now() - interval '3 hours'
  message:
    en: "😷 The haze is unhealthy: NEA's 24-hour PSI is {psi:.0f} in your region ({name}).\n\nAt this level fine particles bother anyone outdoors for long, and children, older people and anyone with asthma or heart problems feel it first.\n\n👉 Keep outdoor effort short, wear an N95 if you must go out, and keep windows shut with the purifier on."
    id: "😷 Kabutnya tidak sehat: PSI 24 jam NEA {psi:.0f} di wilayah Anda ({name}).\n\nPada tingkat ini partikel halus mengganggu siapa pun yang lama di luar, dan anak-anak, lansia, serta penderita asma atau jantung merasakannya lebih dulu.\n\n👉 Batasi aktivitas di luar, pakai N95 kalau harus keluar, tutup jendela dan nyalakan pembersih udara."
    es: "😷 La neblina de humo no es saludable: el PSI de 24 horas de la NEA es {psi:.0f} en tu región ({name}).\n\nCon este nivel las partículas finas molestan a cualquiera que pase mucho tiempo fuera, y los niños, los mayores y quien tenga asma o problemas de corazón lo notan primero.\n\n👉 Reduce el esfuerzo al aire libre, usa una N95 si tienes que salir y mantén las ventanas cerradas con el purificador encendido."

- id: haze_pm25_elevated
  level: warn
  cooldown_minutes: 180
  # NEA's 1-hour PM2.5 bands: 55 and under is Normal, 56-150 Elevated. This fires on the hourly reading, which turns
  # sooner than the 24-hour PSI above.
  sql: |
    SELECT sensor_id, name, value::float AS pm25
    FROM observations
    WHERE sensor_id = 'nea-pm25' AND metric = 'pm25' AND value > 55 AND ts > now() - interval '90 minutes'
  message:
    en: "🌫️ NEA's hourly PM2.5 is {pm25:.0f} µg/m³ in your region ({name}), above the Normal band.\n\nThe haze may be building. The 24-hour PSI will follow later.\n\n👉 Worth checking your own sensor against it before deciding whether to open windows."
    id: "🌫️ PM2.5 per jam dari NEA {pm25:.0f} µg/m³ di wilayah Anda ({name}), di atas pita Normal.\n\nKabut asap mungkin sedang menebal. PSI 24 jam akan menyusul.\n\n👉 Bandingkan dengan sensor Anda sebelum memutuskan membuka jendela."
    es: "🌫️ El PM2.5 horario de la NEA es {pm25:.0f} µg/m³ en tu región ({name}), por encima de la banda Normal.\n\nQuizá la neblina esté aumentando. El PSI de 24 horas llegará después.\n\n👉 Compáralo con tu propio sensor antes de decidir si abrir las ventanas."

- id: heat_index_danger
  level: warn
  cooldown_minutes: 720
  # Warn, once a day at most: Singapore's afternoons sit near this line, so an act-level rule would page you daily.
  # Raise 103 below (and 39.4 in the text above) if you want it to mean an unusual day.
  sql: |
    WITH fresh_wbgt AS (SELECT 1 FROM observations WHERE sensor_id = 'nea-wbgt' AND metric = 'heat_stress_level'
                        AND ts > now() - interval '60 minutes' LIMIT 1),
         t AS (SELECT value, ts FROM observations
               WHERE sensor_id = 'nea-temp' AND metric = 'temp' AND ts > now() - interval '30 minutes'
               ORDER BY ts DESC LIMIT 1),
         h AS (SELECT value, ts FROM observations
               WHERE sensor_id = 'nea-humidity' AND metric = 'humidity' AND ts > now() - interval '30 minutes'
               ORDER BY ts DESC LIMIT 1),
         x AS (SELECT (t.value * 9 / 5 + 32) AS f, h.value AS r, t.value AS c FROM t, h),
         hi AS (SELECT c, r,
                       -42.379 + 2.04901523*f + 10.14333127*r - 0.22475541*f*r - 0.00683783*f*f
                       - 0.05481717*r*r + 0.00122874*f*f*r + 0.00085282*f*r*r - 0.00000199*f*f*r*r AS hi_f
                FROM x WHERE f >= 80 AND r >= 40)
    SELECT 'nea-heat' AS sensor_id, round(((hi_f - 32) * 5 / 9)::numeric, 0)::float AS hi,
           round(c::numeric, 1)::float AS temp, round(r::numeric, 0)::float AS rh
    FROM hi WHERE hi_f >= 103 AND NOT EXISTS (SELECT 1 FROM fresh_wbgt)
  message:
    en: "🥵 It feels like {hi:.0f}°C outside: {temp:.1f}°C at {rh:.0f}% humidity.\n\nThat is the heat index's Danger band. Cramps and heat exhaustion become likely with time in the sun or hard effort, and older people and small children are hit first.\n\n👉 Drink water before you are thirsty, move hard work to early morning or evening, and check on anyone who lives alone. This is a heat index, not the WBGT that NEA's own heat advisories use."
    id: "🥵 Terasa seperti {hi:.0f}°C di luar: {temp:.1f}°C dengan kelembapan {rh:.0f}%.\n\nIni pita Bahaya pada indeks panas. Kram dan kelelahan panas jadi mungkin terjadi bila lama di bawah matahari atau bekerja keras, dan lansia serta anak kecil terkena lebih dulu.\n\n👉 Minum sebelum haus, pindahkan pekerjaan berat ke pagi atau sore, dan tengok orang yang tinggal sendiri. Ini indeks panas, bukan WBGT yang dipakai peringatan panas NEA."
    es: "🥵 Se siente como {hi:.0f}°C afuera: {temp:.1f}°C con {rh:.0f}% de humedad.\n\nEs la banda de Peligro del índice de calor. Los calambres y el agotamiento por calor se vuelven probables con tiempo al sol o esfuerzo intenso, y los mayores y los niños pequeños lo sufren primero.\n\n👉 Bebe agua antes de tener sed, pasa el trabajo duro a la mañana temprano o a la tarde, y llama a quien viva solo. Es un índice de calor, no el WBGT que usan los avisos de calor de la NEA."

- id: uv_extreme
  level: act
  cooldown_minutes: 720
  sql: |
    SELECT sensor_id, name, value::float AS uv
    FROM observations
    WHERE sensor_id = 'nea-uv' AND metric = 'uv' AND value >= 11 AND ts > now() - interval '90 minutes'
  message:
    en: "☀️ The UV index is {uv:.0f}, Extreme.\n\nUnprotected skin can burn in well under fifteen minutes around midday.\n\n👉 Shade, a hat and sunscreen if you have to be out, and plan the long outdoor jobs for before ten or after four."
    id: "☀️ Indeks UV {uv:.0f}, Ekstrem.\n\nKulit tanpa pelindung bisa terbakar dalam kurang dari lima belas menit di sekitar tengah hari.\n\n👉 Cari tempat teduh, pakai topi dan tabir surya kalau harus di luar, dan jadwalkan kerja luar yang lama sebelum pukul sepuluh atau setelah pukul empat."
    es: "☀️ El índice UV es {uv:.0f}, Extremo.\n\nLa piel sin proteger puede quemarse en bastante menos de quince minutos hacia el mediodía.\n\n👉 Sombra, gorra y protector solar si tienes que estar fuera, y deja los trabajos largos al aire libre para antes de las diez o después de las cuatro."

- id: rain_expected_soon
  level: info
  cooldown_minutes: 180
  sql: |
    SELECT sensor_id, name, meta->>'forecast' AS forecast
    FROM observations
    WHERE sensor_id LIKE 'nea-fc2h-%' AND metric = 'fc_rain_expected' AND value = 1 AND ts > now() - interval '3 hours'
  message:
    en: "🌧️ Rain is forecast for the next two hours: {forecast} ({name}).\n\n👉 Bring in the washing and keep an umbrella by the door."
    id: "🌧️ Hujan diperkirakan dalam dua jam ke depan: {forecast} ({name}).\n\n👉 Angkat jemuran dan siapkan payung di dekat pintu."
    es: "🌧️ Se prevé lluvia en las próximas dos horas: {forecast} ({name}).\n\n👉 Recoge la ropa tendida y deja un paraguas junto a la puerta."

- id: heavy_rain_now
  level: warn
  cooldown_minutes: 60
  # 2 mm in five minutes is about 24 mm an hour. The nearest gauge only; island-wide rain is rain_max on nea-rain-island.
  sql: |
    SELECT sensor_id, name, value::float AS mm
    FROM observations
    WHERE sensor_id = 'nea-rain' AND metric = 'rain' AND value >= 2 AND ts > now() - interval '30 minutes'
  message:
    en: "⛈️ Heavy rain at {name}: {mm:.1f} mm in the last five minutes.\n\nThat rate can flood low ground and streets within the hour.\n\n👉 Keep off low-lying roads and underpasses until it eases."
    id: "⛈️ Hujan deras di {name}: {mm:.1f} mm dalam lima menit terakhir.\n\nLaju ini bisa membanjiri tempat rendah dan jalan dalam satu jam.\n\n👉 Hindari jalan dan underpass yang rendah sampai reda."
    es: "⛈️ Lluvia intensa en {name}: {mm:.1f} mm en los últimos cinco minutos.\n\nA ese ritmo pueden inundarse las zonas bajas y las calles en una hora.\n\n👉 Evita las calles bajas y los pasos inferiores hasta que amaine."

- id: strong_wind
  level: warn
  cooldown_minutes: 120
  sql: |
    SELECT sensor_id, name, value::float AS kt
    FROM observations
    WHERE sensor_id = 'nea-windspeed' AND metric = 'wind_speed' AND value >= 20 AND ts > now() - interval '30 minutes'
  message:
    en: "💨 Strong wind at {name}: {kt:.0f} knots.\n\nLoose items on balconies and roofs can fly, and branches come down.\n\n👉 Bring in anything light from outside and stay clear of trees."
    id: "💨 Angin kencang di {name}: {kt:.0f} knot.\n\nBarang lepas di balkon dan atap bisa terbang, dan dahan bisa patah.\n\n👉 Masukkan barang ringan dari luar dan jauhi pohon."
    es: "💨 Viento fuerte en {name}: {kt:.0f} nudos.\n\nLos objetos sueltos en balcones y tejados pueden salir volando y se caen ramas.\n\n👉 Guarda lo ligero que esté fuera y aléjate de los árboles."

- id: heat_stress_high
  level: act
  cooldown_minutes: 240
  # NEA's own category for the nearest WBGT station: High. The category is NEA's, not this node's.
  sql: |
    SELECT sensor_id, name, (SELECT value FROM observations o2 WHERE o2.sensor_id = o.sensor_id AND o2.metric = 'wbgt')::float AS wbgt
    FROM observations o
    WHERE sensor_id = 'nea-wbgt' AND metric = 'heat_stress_level' AND value >= 2 AND ts > now() - interval '45 minutes'
  message:
    en: "🥵 Heat stress is HIGH at {name}: WBGT {wbgt:.1f}°C.\n\nThis is NEA's own heat-stress category, the one built for people working or exercising outdoors.\n\n👉 Move hard outdoor work and exercise indoors or to a cooler hour, take breaks in shade with water, and look in on anyone who is old, ill or alone."
    id: "🥵 Tekanan panas TINGGI di {name}: WBGT {wbgt:.1f}°C.\n\nIni kategori tekanan panas NEA sendiri, yang dibuat untuk orang yang bekerja atau berolahraga di luar.\n\n👉 Pindahkan kerja berat dan olahraga ke dalam ruangan atau jam yang lebih sejuk, istirahat di tempat teduh sambil minum, dan tengok orang tua, sakit, atau sendirian."
    es: "🥵 El estrés térmico es ALTO en {name}: WBGT {wbgt:.1f}°C.\n\nEs la categoría de estrés térmico de la propia NEA, pensada para quien trabaja o hace ejercicio al aire libre.\n\n👉 Pasa el trabajo duro y el ejercicio a interior o a una hora más fresca, descansa a la sombra con agua y visita a quien sea mayor, esté enfermo o viva solo."

- id: heat_stress_moderate
  level: warn
  cooldown_minutes: 720
  sql: |
    SELECT sensor_id, name, (SELECT value FROM observations o2 WHERE o2.sensor_id = o.sensor_id AND o2.metric = 'wbgt')::float AS wbgt
    FROM observations o
    WHERE sensor_id = 'nea-wbgt' AND metric = 'heat_stress_level' AND value = 1 AND ts > now() - interval '45 minutes'
  message:
    en: "🌡️ Heat stress is Moderate at {name}: WBGT {wbgt:.1f}°C.\n\n👉 Drink water regularly and take breaks in the shade if you are working or exercising outside."
    id: "🌡️ Tekanan panas Sedang di {name}: WBGT {wbgt:.1f}°C.\n\n👉 Minum air secara teratur dan istirahat di tempat teduh bila bekerja atau berolahraga di luar."
    es: "🌡️ El estrés térmico es Moderado en {name}: WBGT {wbgt:.1f}°C.\n\n👉 Bebe agua con regularidad y descansa a la sombra si trabajas o haces ejercicio fuera."

- id: flood_alert_active
  level: warn
  cooldown_minutes: 60
  sql: |
    SELECT sensor_id, name, value::float AS alerts
    FROM observations
    WHERE sensor_id = 'nea-flood' AND metric = 'flood_alerts_active' AND value > 0 AND ts > now() - interval '30 minutes'
  message:
    en: "🌊 PUB has {alerts:.0f} active flood alert(s) in Singapore right now.\n\n👉 Check the PUB flood map before driving, and keep off low-lying roads and underpasses."
    id: "🌊 PUB sedang mengeluarkan {alerts:.0f} peringatan banjir aktif di Singapura.\n\n👉 Cek peta banjir PUB sebelum berkendara dan hindari jalan serta underpass yang rendah."
    es: "🌊 La PUB tiene ahora {alerts:.0f} alerta(s) de inundación activa(s) en Singapur.\n\n👉 Consulta el mapa de inundaciones de la PUB antes de conducir y evita las calles bajas y los pasos inferiores."

- id: flood_alert_near
  level: act
  cooldown_minutes: 60
  # Only when the alert carries a location and it is within 2 km. If PUB's record has none, this stays silent and
  # flood_alert_active above still speaks.
  sql: |
    SELECT sensor_id, name, value::float AS km
    FROM observations
    WHERE sensor_id = 'nea-flood' AND metric = 'flood_nearest_km' AND value <= 2 AND ts > now() - interval '30 minutes'
  message:
    en: "🌊 A PUB flood alert is {km:.1f} km from you.\n\nWater can rise quickly in drains and low ground.\n\n👉 Do not walk or drive through flooded streets, move things off the floor if you live at ground level, and check the PUB flood map."
    id: "🌊 Ada peringatan banjir PUB sejauh {km:.1f} km dari Anda.\n\nAir bisa naik cepat di selokan dan tempat rendah.\n\n👉 Jangan berjalan atau berkendara menembus jalan yang banjir, angkat barang dari lantai bila tinggal di lantai dasar, dan cek peta banjir PUB."
    es: "🌊 Hay una alerta de inundación de la PUB a {km:.1f} km de ti.\n\nEl agua puede subir deprisa en desagües y zonas bajas.\n\n👉 No camines ni conduzcas por calles inundadas, sube las cosas del suelo si vives en planta baja y consulta el mapa de inundaciones de la PUB."

- id: dengue_cluster_here
  level: warn            # not act: an act rule's cooldown may not exceed index.MEASURED_WINDOW_MIN (2880), and a week-long
  cooldown_minutes: 10080  # cluster should not page again every two days
  sql: |
    SELECT o.sensor_id, o.name, coalesce(o.meta->>'nearest_locality', 'your area') AS locality,
           coalesce((SELECT value FROM observations c WHERE c.sensor_id = o.sensor_id AND c.metric = 'dengue_nearest_cases'), 0)::float AS cases
    FROM observations o
    WHERE o.sensor_id = 'nea-dengue' AND o.metric = 'dengue_in_cluster' AND o.value = 1 AND o.ts > now() - interval '2 days'
  message:
    en: "🦟 Your location is inside an active NEA dengue cluster ({locality}, {cases:.0f} cases).\n\nMosquitoes that spread dengue breed in small pools of standing water, and bite by day.\n\n👉 Empty and scrub anything holding water (plant saucers, gutters, pails) every week, use repellent, and see a doctor promptly for a fever."
    id: "🦟 Lokasi Anda berada di dalam klaster demam berdarah NEA yang aktif ({locality}, {cases:.0f} kasus).\n\nNyamuk penyebar demam berdarah berkembang biak di genangan kecil dan menggigit siang hari.\n\n👉 Kosongkan dan sikat semua yang menampung air (alas pot, talang, ember) tiap minggu, pakai repelan, dan segera ke dokter bila demam."
    es: "🦟 Tu ubicación está dentro de un clúster de dengue activo de la NEA ({locality}, {cases:.0f} casos).\n\nLos mosquitos que transmiten el dengue crían en pequeños charcos de agua estancada y pican de día.\n\n👉 Vacía y friega cada semana todo lo que retenga agua (platos de macetas, canaletas, cubos), usa repelente y acude pronto al médico si tienes fiebre."

- id: dengue_cluster_near
  level: warn
  cooldown_minutes: 10080
  sql: |
    SELECT o.sensor_id, o.name, coalesce(o.meta->>'nearest_locality', 'nearby') AS locality, n.value::float AS km
    FROM observations o
    JOIN observations n ON n.sensor_id = o.sensor_id AND n.metric = 'dengue_nearest_km'
    WHERE o.sensor_id = 'nea-dengue' AND o.metric = 'dengue_in_cluster' AND o.value = 0
      AND n.value <= 1 AND o.ts > now() - interval '2 days'
  message:
    en: "🦟 An NEA dengue cluster ({locality}) is {km:.1f} km from you.\n\n👉 Not in it yet: empty standing water around the home once a week and use repellent."
    id: "🦟 Klaster demam berdarah NEA ({locality}) berjarak {km:.1f} km dari Anda.\n\n👉 Belum masuk klaster: kosongkan genangan air di sekitar rumah seminggu sekali dan pakai repelan."
    es: "🦟 Un clúster de dengue de la NEA ({locality}) está a {km:.1f} km de ti.\n\n👉 Aún no estás dentro: vacía el agua estancada en torno a casa una vez por semana y usa repelente."

- id: pm25_local_above_official
  level: info
  cooldown_minutes: 360
  # Your outdoor sensor against NEA's regional hourly PM2.5. A big gap usually means something close by (traffic,
  # cooking, construction, a neighbour burning) rather than the haze the whole island shares.
  sql: |
    SELECT s.sensor_id, s.name, round(s.mean_1h::numeric, 0)::float AS local_pm, round(o.value::numeric, 0)::float AS nea_pm
    FROM stats s
    JOIN LATERAL (SELECT value FROM observations
                  WHERE sensor_id = 'nea-pm25' AND metric = 'pm25' AND ts > now() - interval '90 minutes'
                  ORDER BY ts DESC LIMIT 1) o ON true
    WHERE s.local AND NOT s.indoor AND s.metric = 'pm25' AND s.mean_1h IS NOT NULL
      AND s.mean_1h > o.value * 1.5 AND s.mean_1h - o.value >= 15
  message:
    en: "🔎 {name} reads {local_pm:.0f} µg/m³ PM2.5, well above NEA's {nea_pm:.0f} for your region.\n\nThat gap points to something close by rather than island-wide haze: traffic, cooking, construction or burning.\n\n👉 Worth a look outside before you open windows."
    id: "🔎 {name} membaca PM2.5 {local_pm:.0f} µg/m³, jauh di atas {nea_pm:.0f} dari NEA untuk wilayah Anda.\n\nSelisih ini menunjuk pada sumber di dekat sini, bukan kabut asap se-pulau: lalu lintas, memasak, konstruksi, atau pembakaran.\n\n👉 Cek keadaan di luar sebelum membuka jendela."
    es: "🔎 {name} marca {local_pm:.0f} µg/m³ de PM2.5, muy por encima de los {nea_pm:.0f} de la NEA para tu región.\n\nEsa diferencia apunta a algo cercano y no a una neblina de toda la isla: tráfico, cocina, obras o quema.\n\n👉 Vale la pena mirar afuera antes de abrir ventanas."

# South-east wind that has settled in and is picking up: on this node's own observation, the days the air gets worse are
# often the ones when the wind stays in the south-east and strengthens. This says the pattern is here; it does not say
# the air WILL worsen, and it is a first guess to tune against a season of PSI, not a calibration.
# South-east here is three 16-point compass sectors, east-south-east (ESE) to south-south-east (SSE): 101.25 up to 168.75
# degrees, a 67.5 degree arc centred on 135. "Sustained" = at least 80% of the readings in the
# last three hours are in that sector, with at least 12 readings (the feed is every ten minutes, so 18 is a full three
# hours). "Rising" = the mean speed of the last 90 minutes is at least 1 knot above the 90 minutes before.
# Needs the wind-direction and wind-speed feeds: while data.gov.sg limits them this stays quiet rather than guess.
- id: wind_southeast_rising
  level: warn
  cooldown_minutes: 360
  sql: |
    WITH d AS (SELECT ts, value FROM readings WHERE sensor_id = 'nea-winddir' AND metric = 'wind_dir' AND ts > now() - interval '3 hours'),
         dir AS (SELECT count(*) AS n, count(*) FILTER (WHERE value >= 101.25 AND value < 168.75) AS se FROM d),
         s AS (SELECT ts, value FROM readings WHERE sensor_id = 'nea-windspeed' AND metric = 'wind_speed' AND ts > now() - interval '3 hours'),
         spd AS (SELECT avg(value) FILTER (WHERE ts > now() - interval '90 minutes') AS recent,
                        avg(value) FILTER (WHERE ts <= now() - interval '90 minutes') AS earlier FROM s)
    SELECT 'nea-winddir' AS sensor_id, spd.recent::float AS recent, spd.earlier::float AS earlier,
           coalesce((SELECT value FROM observations WHERE sensor_id = 'nea-pm25' AND metric = 'pm25'), -1)::float AS pm25,
           coalesce((SELECT value FROM observations WHERE sensor_id = 'nea-psi' AND metric = 'psi'), -1)::float AS psi
    FROM dir, spd
    WHERE dir.n >= 12 AND dir.se >= 0.8 * dir.n AND spd.recent >= spd.earlier + 1
  message:
    en: "🌬️ The wind has stayed in the south-east (ESE to SSE) for about three hours and is picking up: {recent:.0f} knots, from {earlier:.0f} before.\n\nAir quality here tends to get worse in this pattern. NEA's PM2.5 nearby is {pm25:.0f} µg/m³ and the PSI is {psi:.0f} (-1 means no reading yet).\n\n👉 Keep an eye on the PSI over the next few hours, and have masks and the purifier ready."
    id: "🌬️ Angin bertahan dari tenggara (ESE hingga SSE) sekitar tiga jam dan menguat: {recent:.0f} knot, sebelumnya {earlier:.0f}.\n\nKualitas udara di sini cenderung memburuk dalam pola ini. PM2.5 NEA di dekat sini {pm25:.0f} µg/m³ dan PSI {psi:.0f} (-1 berarti belum ada data).\n\n👉 Pantau PSI beberapa jam ke depan, dan siapkan masker serta pembersih udara."
    es: "🌬️ El viento lleva unas tres horas en el sureste (ESE a SSE) y va a más: {recent:.0f} nudos, desde {earlier:.0f} antes.\n\nLa calidad del aire aquí tiende a empeorar con este patrón. El PM2.5 de NEA cerca es {pm25:.0f} µg/m³ y el PSI {psi:.0f} (-1 significa sin lectura aún).\n\n👉 Vigila el PSI las próximas horas y ten a mano mascarillas y el purificador."

# Particulates rising together with the wind swinging into the south-east: the same pattern as wind_southeast_rising,
# but tested on this node's OWN street kit instead of assumed, and it is the one that reaches the phone.
# Over the last six hours, in half-hour buckets: correlate the kit's PM2.5 with how far the wind is from the south-east,
# cos(bearing - 135 degrees) (+1 = straight from the south-east, 0 = side-on, -1 = from the north-west; a circular
# quantity, so the bearing itself is never correlated). It fires when ALL of these hold:
#   * at least 10 buckets have both readings (a full six hours is 12)
#   * the wind's alignment actually varied (standard deviation >= 0.25): a steady wind has nothing to correlate with, and
#     a tiny wobble against a rising PM2.5 would otherwise score a high r by chance (wind_southeast_rising covers a steady wind)
#   * Pearson r >= 0.6
#   * PM2.5 in the last 90 minutes is at least 3 ug/m3 above the 90 minutes-plus before it, and at least 15 (the WHO line)
#   * the wind right now is within 60 degrees of south-east (cos >= 0.5)
# Correlation is not cause: haze, traffic and local burning can all move with the wind. Ten or twelve buckets is a small
# sample, so r >= 0.6 is a screen, not proof. THE THRESHOLDS ARE A FIRST GUESS; tune them against a season of alerts.
# Level act: at ALERT_LEVEL=act it is the one that pages, and act ignores quiet hours (22:00-06:00). Lower it to warn to
# keep it on the dashboard only.
- id: wind_pm25_correlated
  level: act
  cooldown_minutes: 720
  sql: |
    WITH pm AS (SELECT to_timestamp(floor(extract(epoch FROM r.ts) / 1800) * 1800) AS b, avg(r.value) AS pm
                FROM readings r JOIN sensors s USING (sensor_id)
                WHERE r.metric = 'pm25' AND s.kind = 'sensor' AND s.local AND NOT s.indoor AND r.ts > now() - interval '6 hours'
                GROUP BY 1),
         w AS (SELECT to_timestamp(floor(extract(epoch FROM ts) / 1800) * 1800) AS b, avg(cos(radians(value - 135))) AS se
               FROM readings WHERE sensor_id = 'nea-winddir' AND metric = 'wind_dir' AND ts > now() - interval '6 hours'
               GROUP BY 1),
         j AS (SELECT pm.b, pm.pm, w.se FROM pm JOIN w USING (b)),
         c AS (SELECT count(*) AS n, corr(se, pm) AS r, stddev_samp(se) AS sd FROM j),
         t AS (SELECT avg(pm) FILTER (WHERE b > now() - interval '90 minutes') AS recent,
                      avg(pm) FILTER (WHERE b <= now() - interval '90 minutes') AS earlier FROM pm),
         nw AS (SELECT se AS now_se FROM w ORDER BY b DESC LIMIT 1)
    SELECT 'nea-winddir' AS sensor_id, c.r::float AS r, c.n::float AS n, t.recent::float AS recent, t.earlier::float AS earlier
    FROM c, t, nw
    WHERE c.n >= 10 AND c.sd >= 0.25 AND c.r >= 0.6 AND t.recent >= t.earlier + 3 AND t.recent >= 15 AND nw.now_se >= 0.5
  message:
    en: "🌬️🌫️ Particulates are rising as the wind swings into the south-east: PM2.5 is {recent:.0f} µg/m³ here, up from {earlier:.0f}, and over the last six hours the two have moved together (correlation {r:.2f} over {n:.0f} half-hours).\n\nThis is a pattern in this node's own readings, not a forecast, and other things can move with the wind too.\n\n👉 Close windows facing the south-east, run the purifier, and keep masks handy while it lasts."
    id: "🌬️🌫️ Partikulat naik saat angin berbelok ke tenggara: PM2.5 {recent:.0f} µg/m³ di sini, naik dari {earlier:.0f}, dan selama enam jam terakhir keduanya bergerak bersama (korelasi {r:.2f} dari {n:.0f} setengah jam).\n\nIni pola dari bacaan node ini sendiri, bukan ramalan, dan hal lain juga bisa ikut bergerak bersama angin.\n\n👉 Tutup jendela yang menghadap tenggara, nyalakan pembersih udara, dan siapkan masker selama kondisi ini."
    es: "🌬️🌫️ Las partículas suben mientras el viento gira al sureste: PM2.5 está en {recent:.0f} µg/m³ aquí, desde {earlier:.0f}, y en las últimas seis horas ambos se han movido juntos (correlación {r:.2f} en {n:.0f} medias horas).\n\nEs un patrón de las lecturas de este nodo, no una previsión, y otras cosas también pueden moverse con el viento.\n\n👉 Cierra las ventanas que dan al sureste, enciende el purificador y ten mascarillas a mano mientras dure."
