# What each NEA metric IS. NEA readings come from stations and regions kilometres from the node, not from this
# place, and the sensors are kind='model', local=False: so nothing here is comparable with the household's sensors.
# psi and its sub-indices are NEA's own composite numbers (index: never pooled). Forecasts are derived (fc_ prefix,
# never comparable), the same rule packs/forecast follows.
- { source: singapore-nea, metric: pm25,            role: ambient, comparable: false, unit: "µg/m³" }
- { source: singapore-nea, metric: temp,            role: ambient, comparable: false, unit: "°C" }
- { source: singapore-nea, metric: humidity,        role: ambient, comparable: false, unit: "%" }
- { source: singapore-nea, metric: rain,            role: ambient, comparable: false, unit: "mm per 5 min" }
- { source: singapore-nea, metric: rain_max,        role: ambient, comparable: false, unit: "mm per 5 min" }
- { source: singapore-nea, metric: rain_wet_pct,    role: ambient, comparable: false, unit: "% of stations" }
- { source: singapore-nea, metric: wind_speed,      role: ambient, comparable: false, unit: "knots" }
- { source: singapore-nea, metric: wind_dir,        role: ambient, comparable: false, unit: "°" }
- { source: singapore-nea, metric: uv,              role: index,   comparable: false, unit: "UV index" }
- { source: singapore-nea, metric: psi,             role: index,   comparable: false }
- { source: singapore-nea, metric: pm25_24h,        role: ambient, comparable: false, unit: "µg/m³ (24 h)" }
- { source: singapore-nea, metric: pm10_24h,        role: ambient, comparable: false, unit: "µg/m³ (24 h)" }
- { source: singapore-nea, metric: so2_24h,         role: ambient, comparable: false, unit: "µg/m³ (24 h)" }
- { source: singapore-nea, metric: no2_1h_max,      role: ambient, comparable: false, unit: "µg/m³ (1 h max)" }
- { source: singapore-nea, metric: co_8h_max,       role: ambient, comparable: false, unit: "mg/m³ (8 h max)" }
- { source: singapore-nea, metric: o3_8h_max,       role: ambient, comparable: false, unit: "µg/m³ (8 h max)" }
- { source: singapore-nea, metric: pm25_sub_index,  role: index,   comparable: false }
- { source: singapore-nea, metric: pm10_sub_index,  role: index,   comparable: false }
- { source: singapore-nea, metric: so2_sub_index,   role: index,   comparable: false }
