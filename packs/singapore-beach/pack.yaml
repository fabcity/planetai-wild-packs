id: singapore-beach
name: Singapore beach water quality
description: >-
  NEA's weekly Enterococcus banding of Singapore's recreational beaches (Band 1 Normal, Band 2 Elevated, Band 3 High),
  for the beaches you choose, so the Coast card can say whether the water is fit for swimming. It fetches NEA's number;
  it does not sample the water.
author: saadcaffeine (Singapore node)
version: 0.1.0
requires: { node: ">=0.40.0" }
kind: code
domain: coast
metrics: [beach_band, beach_band_nearest, beach_stretches_elevated, beach_advisory]
scales: [city]
env:
  - "# singapore-beach: which NEA beaches to follow, comma separated. Any of Changi, East Coast, Pasir Ris, Punggol, Seletar, Sembawang, Palawan, Siloso, Tanjong."
  - "BEACH_AREAS=East Coast,Changi"
needs:
  - www.nea.gov.sg
attribution: >-
  Contains information from the National Environment Agency (Beach Short-Term Water Quality Information, nea.gov.sg),
  accessed by this node, made available under the terms of the Singapore Open Data Licence version 1.0
  (https://data.gov.sg/open-data-licence). Not endorsed by NEA.
