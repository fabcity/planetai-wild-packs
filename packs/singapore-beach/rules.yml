# NEA bands a beach once a week, from the previous week's laboratory results, so these rules speak once a week too
# (cooldown = a week) and only while the banding is recent (nine days: a week's results plus the wait for them).
# They inform and never page: Coast is a context issue, and the levels here are warn and info.
#
# Bands are NEA's: Band 1 Normal (Enterococcus <= 200 per 100 mL), Band 2 Elevated (<= 500), Band 3 High (> 500, or
# two weeks running in Band 2). The pack reports NEA's banding; it does not compute one.

- id: beach_water_elevated
  level: warn
  cooldown_minutes: 10080
  sql: |
    SELECT o.sensor_id, o.name, coalesce(o.meta->>'beach', o.name) AS beach,
           coalesce((SELECT value FROM observations c WHERE c.sensor_id = o.sensor_id AND c.metric = 'beach_stretches_elevated'), 0)::float AS n,
           coalesce((o.meta->>'stretches_total')::float, 1) AS total
    FROM observations o
    WHERE o.sensor_id LIKE 'nea-beach-%' AND o.metric = 'beach_band' AND o.value = 2 AND o.ts > now() - interval '9 days'
  message:
    en: "🏖️ {beach} beach water is Elevated this week (NEA Band 2): {n:.0f} of {total:.0f} stretches.\n\nChildren, the elderly and anyone with a weakened immune system should do less swimming and other full-immersion water activity. Everyone else can carry on.\n\n👉 Rinse off after, and keep out of the water for a day or two after heavy rain."
    id: "🏖️ Air pantai {beach} Meningkat minggu ini (Pita 2 NEA): {n:.0f} dari {total:.0f} ruas.\n\nAnak-anak, lansia, dan orang dengan daya tahan tubuh lemah sebaiknya mengurangi berenang dan aktivitas air lain yang merendam tubuh. Yang lain boleh melanjutkan.\n\n👉 Bilas setelahnya, dan hindari air satu-dua hari setelah hujan lebat."
    es: "🏖️ El agua de la playa {beach} está Elevada esta semana (Banda 2 de NEA): {n:.0f} de {total:.0f} tramos.\n\nNiños, mayores y personas con las defensas bajas deberían bañarse menos y evitar el contacto total con el agua. El resto puede seguir.\n\n👉 Aclárate después y evita el agua uno o dos días tras una lluvia fuerte."

- id: beach_water_high
  level: warn
  cooldown_minutes: 10080
  sql: |
    SELECT o.sensor_id, o.name, coalesce(o.meta->>'beach', o.name) AS beach,
           coalesce((SELECT value FROM observations c WHERE c.sensor_id = o.sensor_id AND c.metric = 'beach_stretches_elevated'), 0)::float AS n,
           coalesce((o.meta->>'stretches_total')::float, 1) AS total
    FROM observations o
    WHERE o.sensor_id LIKE 'nea-beach-%' AND o.metric = 'beach_band' AND o.value >= 3 AND o.ts > now() - interval '9 days'
  message:
    en: "🏖️🚫 {beach} beach water is High this week (NEA Band 3): {n:.0f} of {total:.0f} stretches are Band 2 or worse.\n\nNEA advises everyone to minimise swimming and other full-immersion water activity.\n\n👉 Stay on the sand, or use a pool, until NEA's next weekly banding."
    id: "🏖️🚫 Air pantai {beach} Tinggi minggu ini (Pita 3 NEA): {n:.0f} dari {total:.0f} ruas berada di Pita 2 atau lebih buruk.\n\nNEA menyarankan semua orang meminimalkan berenang dan aktivitas air yang merendam tubuh.\n\n👉 Tetap di pasir, atau pakai kolam renang, sampai pengumuman mingguan NEA berikutnya."
    es: "🏖️🚫 El agua de la playa {beach} está Alta esta semana (Banda 3 de NEA): {n:.0f} de {total:.0f} tramos están en Banda 2 o peor.\n\nNEA aconseja a todos reducir al mínimo el baño y el contacto total con el agua.\n\n👉 Quédate en la arena, o usa una piscina, hasta el próximo aviso semanal de NEA."

- id: beach_bacteria_advisory
  level: warn
  cooldown_minutes: 1440
  sql: |
    SELECT o.sensor_id, o.name, coalesce(o.meta->>'beach', o.name) AS beach
    FROM observations o
    WHERE o.sensor_id LIKE 'nea-beach-%' AND o.metric = 'beach_advisory' AND o.value = 1 AND o.ts > now() - interval '9 days'
  message:
    en: "🏖️⚠️ NEA has flagged a bacteria advisory on the map for {beach} beach: the water is not suitable for swimming.\n\n👉 Check nea.gov.sg/beach-water-quality before going in."
    id: "🏖️⚠️ NEA menandai peringatan bakteri di peta untuk pantai {beach}: air tidak layak untuk berenang.\n\n👉 Periksa nea.gov.sg/beach-water-quality sebelum masuk ke air."
    es: "🏖️⚠️ NEA ha marcado un aviso por bacterias en el mapa de la playa {beach}: el agua no es apta para el baño.\n\n👉 Consulta nea.gov.sg/beach-water-quality antes de entrar."

# NEA's own advice, whatever the band: stay out of the water right after heavy rain, when the drains and canals empty
# onto the beaches. 2 mm in five minutes is the same "heavy" as heavy_rain_now in the singapore-nea pack (about 24 mm
# an hour). The two hours after it is our choice, not NEA's number.
- id: beach_after_heavy_rain
  level: info
  cooldown_minutes: 360
  sql: |
    SELECT r.sensor_id, r.name, r.value::float AS mm
    FROM observations r
    WHERE r.sensor_id = 'nea-rain' AND r.metric = 'rain' AND r.value >= 2 AND r.ts > now() - interval '2 hours'
      AND EXISTS (SELECT 1 FROM observations b WHERE b.sensor_id LIKE 'nea-beach-%' AND b.metric = 'beach_band')
  message:
    en: "🌧️🏖️ Heavy rain just fell near you ({mm:.1f} mm in five minutes).\n\nNEA advises staying out of the sea right after heavy rain, whatever this week's beach band says.\n\n👉 Give it a day before swimming."
    id: "🌧️🏖️ Hujan lebat baru turun di dekat Anda ({mm:.1f} mm dalam lima menit).\n\nNEA menyarankan tidak masuk ke laut tepat setelah hujan lebat, apa pun pita pantai minggu ini.\n\n👉 Tunggu satu hari sebelum berenang."
    es: "🌧️🏖️ Acaba de caer una lluvia fuerte cerca de ti ({mm:.1f} mm en cinco minutos).\n\nNEA aconseja no entrar al mar justo después de una lluvia fuerte, diga lo que diga la banda de esta semana.\n\n👉 Espera un día antes de bañarte."
