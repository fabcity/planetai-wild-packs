# Two rules, both about the wind and the fires being on the same side of the node. Neither says haze WILL arrive:
# smoke rides winds well above the ground, over hours to days. They say that fires are burning where the wind at the
# node is coming from, which is the early part of the story.
#
# Wind: a 10-minute mean bearing the wind blows FROM, from NEA's station feed (singapore-nea pack) when it is present,
# otherwise the forecast pack's fc_wind_direction. The forecast pack stores values at their VALID time, which is in
# the future, so both are bounded to ts <= now() and the measured row is preferred over any forecast. Sector k is bearing k*45 (0 = north). "Upwind" is that sector and
# its two neighbours: a 135 degree arc, because a single instant's wind bearing wanders by more than 45 degrees.
#
# THE THRESHOLDS ARE A FIRST GUESS, not a calibration. 50 and 200 hotspots in a day are round numbers chosen so a
# quiet week says nothing and a burning season says something. Tune them against a season of real data and the PSI.
# Levels: warn is dashboard-only at the default ALERT_LEVEL=act, so the heavier rule is the only one that pages.

- id: fire_smoke_upwind
  level: warn
  cooldown_minutes: 720
  sql: |
    WITH w AS (SELECT value FROM observations
               WHERE ((sensor_id = 'nea-winddir' AND metric = 'wind_dir') OR metric = 'fc_wind_direction')
                 AND ts <= now() AND ts > now() - interval '3 hours'
               ORDER BY (sensor_id = 'nea-winddir') DESC, ts DESC LIMIT 1),
         d AS (SELECT k,
                      'fires_' || (ARRAY['n','ne','e','se','s','sw','w','nw'])[((k + 7) % 8) + 1] AS m1,
                      'fires_' || (ARRAY['n','ne','e','se','s','sw','w','nw'])[(k % 8) + 1] AS m2,
                      'fires_' || (ARRAY['n','ne','e','se','s','sw','w','nw'])[((k + 1) % 8) + 1] AS m3
               FROM (SELECT (round(value / 45.0)::int % 8) AS k FROM w) x),
         u AS (SELECT sum(o.value) AS n, d.k
               FROM d JOIN observations o
                 ON o.sensor_id = 'firms-hotspots'
                AND o.metric IN (d.m1, d.m2, d.m3)
                AND o.ts > now() - interval '8 hours'
               GROUP BY d.k)
    SELECT 'fire-smoke' AS sensor_id, n::float AS fires,
           (ARRAY['north','north-east','east','south-east','south','south-west','west','north-west'])[k + 1] AS from_dir
    FROM u WHERE n >= 50 AND n < 200
  message:
    en: "🔥 Satellites saw {fires:.0f} fires in the last day on the side the wind is coming from ({from_dir}).\n\nSmoke does not follow the ground wind exactly and can take a day or more to arrive, so this is an early heads-up, not a forecast of haze.\n\n👉 Keep an eye on the PSI over the next day or two, and have masks and the purifier ready."
    id: "🔥 Satelit mendeteksi {fires:.0f} titik api dalam sehari terakhir di sisi asal angin ({from_dir}).\n\nAsap tidak selalu mengikuti angin permukaan dan bisa sehari atau lebih sebelum tiba, jadi ini peringatan dini, bukan ramalan kabut asap.\n\n👉 Pantau PSI satu-dua hari ke depan, dan siapkan masker serta pembersih udara."
    es: "🔥 Los satélites detectaron {fires:.0f} incendios en el último día del lado de donde sopla el viento ({from_dir}).\n\nEl humo no sigue exactamente el viento a ras de suelo y puede tardar un día o más en llegar, así que es un aviso temprano, no una previsión de neblina.\n\n👉 Vigila el índice de calidad del aire en el próximo día o dos y ten a mano mascarillas y el purificador."

- id: fire_smoke_upwind_heavy
  level: act
  cooldown_minutes: 1440
  sql: |
    WITH w AS (SELECT value FROM observations
               WHERE ((sensor_id = 'nea-winddir' AND metric = 'wind_dir') OR metric = 'fc_wind_direction')
                 AND ts <= now() AND ts > now() - interval '3 hours'
               ORDER BY (sensor_id = 'nea-winddir') DESC, ts DESC LIMIT 1),
         d AS (SELECT k,
                      'fires_' || (ARRAY['n','ne','e','se','s','sw','w','nw'])[((k + 7) % 8) + 1] AS m1,
                      'fires_' || (ARRAY['n','ne','e','se','s','sw','w','nw'])[(k % 8) + 1] AS m2,
                      'fires_' || (ARRAY['n','ne','e','se','s','sw','w','nw'])[((k + 1) % 8) + 1] AS m3
               FROM (SELECT (round(value / 45.0)::int % 8) AS k FROM w) x),
         u AS (SELECT sum(o.value) AS n, d.k
               FROM d JOIN observations o
                 ON o.sensor_id = 'firms-hotspots'
                AND o.metric IN (d.m1, d.m2, d.m3)
                AND o.ts > now() - interval '8 hours'
               GROUP BY d.k)
    SELECT 'fire-smoke' AS sensor_id, n::float AS fires,
           (ARRAY['north','north-east','east','south-east','south','south-west','west','north-west'])[k + 1] AS from_dir
    FROM u WHERE n >= 200
  message:
    en: "🔥 A large number of fires ({fires:.0f} in the last day) are burning on the side the wind is coming from ({from_dir}).\n\nThat is the pattern that has brought haze before. It can still miss you if the wind turns, and it may take a day or more.\n\n👉 Have N95 masks and the purifier ready, and check the PSI each morning. Older people, children and anyone with asthma should be ready to stay in."
    id: "🔥 Sangat banyak titik api ({fires:.0f} dalam sehari terakhir) menyala di sisi asal angin ({from_dir}).\n\nPola ini pernah membawa kabut asap. Bisa saja meleset kalau angin berbalik, dan mungkin butuh sehari atau lebih.\n\n👉 Siapkan masker N95 dan pembersih udara, dan cek PSI tiap pagi. Lansia, anak-anak, dan penderita asma sebaiknya siap tinggal di dalam."
    es: "🔥 Un gran número de incendios ({fires:.0f} en el último día) arden del lado de donde sopla el viento ({from_dir}).\n\nEs el patrón que ya ha traído neblina antes. Aún puede no llegarte si cambia el viento, y puede tardar un día o más.\n\n👉 Ten mascarillas N95 y el purificador listos y consulta el índice de calidad del aire cada mañana. Mayores, niños y personas con asma deben estar preparados para quedarse dentro."
