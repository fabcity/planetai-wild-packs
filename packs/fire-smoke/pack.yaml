id: fire-smoke
name: Fire and smoke
description: >-
  Satellite-detected fires within a few hundred kilometres of this node, counted by the compass direction they lie in,
  so a rule can say when the wind is coming from where the fires are. It fetches; it does not predict the haze.
author: saadcaffeine (Singapore node)
version: 0.1.1
requires: { node: ">=0.40.0" }
kind: code
domain: air
metrics: [fires_24h, fires_prev_24h, fires_250km_24h, fires_frp_mw_24h, fires_nearest_km,
          fires_n, fires_ne, fires_e, fires_se, fires_s, fires_sw, fires_w, fires_nw]
scales: [city, community]
env:
  - "# fire-smoke: a free NASA FIRMS MAP_KEY (https://firms.modaps.eosdis.nasa.gov/api/map_key/). Blank = the pack idles."
  - "FIRMS_MAP_KEY="
  - "# fire-smoke: how far from the node to count fires, in km. 500 reaches Sumatra and Kalimantan from Singapore."
  - "FIRE_RADIUS_KM=500"
  - "# fire-smoke: comma-separated FIRMS sources. Each is one request every three hours."
  - "FIRE_SOURCES=VIIRS_SNPP_NRT,VIIRS_NOAA20_NRT"
needs:
  - firms.modaps.eosdis.nasa.gov
attribution: >-
  Active fire data from NASA FIRMS (Fire Information for Resource Management System), part of NASA's Land, Atmosphere
  Near real-time Capability for EOS (LANCE), using VIIRS 375 m detections. Free to use with attribution.
