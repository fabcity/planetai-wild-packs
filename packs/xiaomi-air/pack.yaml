id: xiaomi-air
name: Xiaomi air purifiers (LAN)
description: >-
  Xiaomi / Mi Home air purifiers read directly on the LAN over the miio/MIoT protocol — PM2.5, temperature,
  humidity and filter life, indoor. Never the vendor cloud after setup: the only cloud step is extracting the
  device tokens once. The readings feed the air-quality pack's indoor rules and the trust pack's liveness
  checks like any other local sensor.
author: PLANETAI community
version: 0.1.0
requires: { node: ">=0.50.0" }
kind: code
domain: air
metrics: [pm25, temp, humidity, filter_life]
scales: [community]
# python-miio pinned to master@SHA via tarball (the slim image has no git, so `git+https` fails).
# PyPI 0.5.12 hard-requires netifaces, which has no aarch64/modern-python wheels and fails to build
# in the slim image (no gcc). Master demotes netifaces to an optional extra.
pip: ["python-miio @ https://github.com/rytilahti/python-miio/archive/9a00e0888ef85f8d8d84888cabd9e46d1b0a18df.tar.gz"]
env:
  # No padding after `=`: a value pasted after spaces makes the line `VAR= value`, which shell reads as a command.
  - "# xiaomi-air: comma-separated purifiers, each `name@ip=token` (name and `name@` optional)."
  - "# Tokens come from xiaomi-cloud-tokens-extractor (one Mi Home login, once); the LAN handshake does not expose them on current firmware."
  - "# Example: XIAOMI_PURIFIERS=Living Room@192.168.4.98=0123456789abcdef0123456789abcdef,Bedroom@192.168.4.109=fedcba9876543210fedcba9876543210"
  - "XIAOMI_PURIFIERS="
# Each entry carries a device token, which controls the purifier on the LAN: masked once saved, even to the admin token.
secrets: [XIAOMI_PURIFIERS]
needs: >-
  Each purifier's 32-hex device token (extract once with xiaomi-cloud-tokens-extractor) and a fixed IP or
  DHCP reservation per unit on the node's LAN. Devices must be on 2.4 GHz WiFi reachable from the node.
