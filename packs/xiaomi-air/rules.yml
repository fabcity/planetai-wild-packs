# Xiaomi purifier consumables. One rule: the filter is a thing to act on once, not a number to watch.
# Threshold: 10% remaining — Xiaomi's own app starts warning at ~5%, which is late for ordering a
# replacement to Bali (or anywhere an original filter takes a week to arrive).

- id: purifier_filter_low
  level: warn
  cooldown_minutes: 10080
  sql: |
    SELECT sensor_id, name, mean_15m FROM stats
    WHERE local AND indoor AND metric = 'filter_life' AND mean_15m < 10
  message:
    en: "The {name} filter is at {mean_15m:.0f}%. Order a replacement this week."
    id: "Filter {name} tersisa {mean_15m:.0f}%. Pesan penggantinya minggu ini."
    es: "El filtro de {name} está al {mean_15m:.0f}%. Pide un recambio esta semana."
