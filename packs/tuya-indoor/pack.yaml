id: tuya-indoor
name: Tuya / Smart Life room sensors
description: >-
  Indoor temperature and humidity from Tuya / Smart Life sensors, read through the Tuya Cloud API, one named room
  per device. The readings join the indoor rules like any other room sensor.
author: saadcaffeine (Singapore node)
version: 0.1.0
requires: { node: ">=0.40.0" }
kind: code
domain: heat
metrics: [temp, humidity]
scales: [community]
env:
  - "# tuya-indoor: the Access ID and Access Secret of your cloud project on platform.tuya.com. Secrets: never share them."
  - "TUYA_ACCESS_ID="
  - "TUYA_ACCESS_SECRET="
  - "# tuya-indoor: the project's data centre, the one your Smart Life account is in: eu, us, sg, in or cn."
  - "TUYA_REGION=eu"
  - "# tuya-indoor: devices as id=Room name, comma separated. Ids are in the project's Devices list."
  - "TUYA_DEVICES="
  - "# tuya-indoor: device ids (from TUYA_DEVICES) that are secondary rooms: still read and drawn, but not the house's number and no heat alerts. An empty sun-baked workshop, say."
  - "TUYA_SECONDARY="
  - "# tuya-indoor: minutes between polls (5 or more). Tuya's free tier limits the calls a month."
  - "TUYA_EVERY_MIN=10"
needs:
  - openapi.tuyaeu.com
attribution: >-
  Readings from the owner's own Tuya / Smart Life devices through the Tuya Cloud API.
